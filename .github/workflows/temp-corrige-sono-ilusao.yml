name: Corrigir Sono e Ilusao legada

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-corrige-sono-ilusao.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar patch
        run: python .github/patches/patch_sono_ilusao.py

      - name: Validar sintaxe e regressoes
        run: |
          node --check src/durable/PvpCoordinator.js
          node --check src/systems/element-compatibility.js
          node --check src/systems/sleep.js
          node testar_regressao_sono_debuff_e_ilusao.mjs
          node testar_sono_pvp.mjs
          node testar_integracao_sono_pvp.mjs
          node testar_confusao_pvp.mjs
          node testar_integracao_confusao_pvp.mjs
          node testar_lentidao_pvp.mjs
          node testar_silencio_pvp.mjs
          node testar_cegueira_pvp.mjs
          node testar_controle_pvp.mjs
          node testar_persistencia_perfil_forte.mjs
          node testar_regen_mentalidade_pvp.mjs

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/durable/PvpCoordinator.js src/systems/element-compatibility.js testar_regressao_sono_debuff_e_ilusao.mjs
          git commit -m "Corrige Sono e remove Ilusao como elemento" || exit 0
          git push
