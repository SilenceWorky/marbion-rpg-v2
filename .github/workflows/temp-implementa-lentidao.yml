name: Implementar Lentidao no PvP

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-implementa-lentidao.yml"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Implementar Lentidao
        run: python .github/patches/patch_lentidao.py

      - name: Validar sintaxe e testes
        run: |
          node --check src/systems/slowdown.js
          node --check src/durable/PvpCoordinator.js
          node --check src/routes/attack.js
          node --check src/routes/estado.js
          node testar_lentidao_pvp.mjs
          node testar_mensagens_lentidao.mjs
          node testar_cegueira_pvp.mjs
          node testar_cegueira_ordem_pvp.mjs
          node testar_sangramento_pvp.mjs
          node testar_veneno_pvp.mjs
          node testar_queimadura_pvp.mjs
          node testar_controle_pvp.mjs
          node testar_paralisia_pvp.mjs
          node testar_congelamento_pvp.mjs
          node testar_atordoamento_pvp.mjs
          node testar_regen_mentalidade_pvp.mjs

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/durable/PvpCoordinator.js src/routes/attack.js src/routes/estado.js
          git commit -m "Integra Lentidao ao PvP" || exit 0
          git push
