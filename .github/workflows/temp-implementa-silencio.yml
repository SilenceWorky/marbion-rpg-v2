name: Implementar Silencio no PvP

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-implementa-silencio.yml"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Implementar Silencio
        run: |
          python - <<'PY'
          from pathlib import Path

          # ============================================================
          # PvpCoordinator.js
          # ============================================================
          path = Path("src/durable/PvpCoordinator.js")
          text = path.read_text(encoding="utf-8")

          marker = '''  MEDITATION_SKILL
          } from "../systems/skill-effects.js";'''
          marker = "\n".join(line[10:] if line.startswith("          ") else line for line in marker.splitlines())

          addition = '''  MEDITATION_SKILL
          } from "../systems/skill-effects.js";

          import {
            applySilenceEffect,
            checkSilenceRestriction
          } from "../systems/silence.js";'''
          addition = "\n".join(line[10:] if line.startswith("          ") else line for line in addition.splitlines())

          if marker not in text:
              raise SystemExit("Import de skill-effects nao encontrado")
          text = text.replace(marker, addition, 1)

          marker = "\n\nfunction executePoisonAction("
          silence_function = r'''

function executeSilenceAction(
  attacker,
  defender,
  action,
  currentTurn,
  defenderAlreadyActed = false
) {
  const base =
    executeOffensiveAction(
      attacker,
      defender,
      action
    );


  if (!base.hit) {
    return {
      ...base,
      kind: "silence",
      silenceApplied: false,
      silence: null
    };
  }


  if (
    Number(
      defender.hp
    ) <= 0
  ) {
    return {
      ...base,
      kind: "silence",
      silenceApplied: false,
      silence: null
    };
  }


  const silence =
    applySilenceEffect(
      defender,
      action.skill,
      currentTurn,
      {
        targetAlreadyActed:
          defenderAlreadyActed
      }
    );


  return {
    ...base,
    kind: "silence",
    silenceApplied:
      silence.ok,
    silence
  };
}
'''

          if marker not in text:
              raise SystemExit("Ponto de insercao de executeSilenceAction nao encontrado")
          text = text.replace(marker, silence_function + marker, 1)

          marker = '''  const controlType =
            String(
              action?.skill?.controlType ?? ""
            )
              .trim()
              .toLowerCase();'''
          marker = "\n".join(line[10:] if line.startswith("          ") else line for line in marker.splitlines())

          addition = marker + r'''

  const restrictionType =
    String(
      action?.skill?.restrictionType ?? ""
    )
      .trim()
      .toLowerCase();'''

          if marker not in text:
              raise SystemExit("controlType nao encontrado")
          text = text.replace(marker, addition, 1)

          marker = r'''  /*
   * ==============================
   * CEGUEIRA
   * ==============================
   *
   * Dano direto + reducao temporaria
   * de Precisao.
   */'''

          addition = r'''  /*
   * ==============================
   * SILÊNCIO
   * ==============================
   *
   * Dano direto + restrição temporária
   * a habilidades não físicas.
   */
  if (
    restrictionType ===
      "silencio"
  ) {
    return executeSilenceAction(
      attacker,
      defender,
      action,
      currentTurn,
      defenderAlreadyActed
    );
  }


''' + marker

          if marker not in text:
              raise SystemExit("Bloco de Cegueira nao encontrado")
          text = text.replace(marker, addition, 1)

          marker = "\nexport class PvpCoordinator {"
          helper = r'''

function createSilenceBlockedExecution(
  player,
  action,
  silenceResult
) {
  return {
    kind:
      "silence_blocked",

    attacker:
      player.user,

    skill:
      action?.skill?.nome ??
      "Habilidade",

    blocked:
      true,

    silence:
      silenceResult?.effect ??
      null
  };
}
'''

          if marker not in text:
              raise SystemExit("Classe PvpCoordinator nao encontrada")
          text = text.replace(marker, helper + marker, 1)

          marker = '''    const mentalidadeCheck =
            canPaySkillCost(
              player,
              selectedAction.skill
            );'''
          marker = "\n".join(line[10:] if line.startswith("          ") else line for line in marker.splitlines())

          addition = r'''    const silenceSelection =
      checkSilenceRestriction(
        player,
        selectedAction.skill,
        battle.turn
      );


    if (
      silenceSelection.blocked
    ) {
      return {
        ok: false,
        error:
          "SILENCED_SKILL",
        slot:
          normalizedSlot,
        skill:
          selectedAction.skill.nome,
        source:
          silenceSelection.effect?.source ??
          "Silêncio",
        expiresAtTurn:
          silenceSelection.effect?.expiresAtTurn ??
          null
      };
    }


''' + marker

          if marker not in text:
              raise SystemExit("mentalidadeCheck nao encontrado")
          text = text.replace(marker, addition, 1)

          marker = '''    const firstControl =
            consumeControlBlock(
              first.player
            );


          let firstExecution;'''
          marker = "\n".join(line[10:] if line.startswith("          ") else line for line in marker.splitlines())

          addition = '''    const firstControl =
            consumeControlBlock(
              first.player
            );


          const firstSilence =
            checkSilenceRestriction(
              first.player,
              first.action.skill,
              battle.turn
            );


          let firstExecution;'''
          addition = "\n".join(line[10:] if line.startswith("          ") else line for line in addition.splitlines())

          if marker not in text:
              raise SystemExit("firstControl nao encontrado")
          text = text.replace(marker, addition, 1)

          marker = '''    else {
            spendSkillMentalidade(
              first.player,
              first.action.skill
            );'''
          marker = "\n".join(line[10:] if line.startswith("          ") else line for line in marker.splitlines())

          addition = r'''    else if (
      firstSilence.blocked
    ) {
      firstExecution =
        createSilenceBlockedExecution(
          first.player,
          first.action,
          firstSilence
        );
    }


''' + marker

          if marker not in text:
              raise SystemExit("Execucao normal do primeiro jogador nao encontrada")
          text = text.replace(marker, addition, 1)

          marker = '''    const secondControl =
            consumeControlBlock(
              second.player
            );'''
          marker = "\n".join(line[10:] if line.startswith("          ") else line for line in marker.splitlines())

          addition = marker + r'''


    const secondSilence =
      checkSilenceRestriction(
        second.player,
        second.action.skill,
        battle.turn
      );'''

          if marker not in text:
              raise SystemExit("secondControl nao encontrado")
          text = text.replace(marker, addition, 1)

          marker = '''    else {
            spendSkillMentalidade(
              second.player,
              second.action.skill
            );'''
          marker = "\n".join(line[10:] if line.startswith("          ") else line for line in marker.splitlines())

          addition = r'''    else if (
      secondSilence.blocked
    ) {
      secondExecution =
        createSilenceBlockedExecution(
          second.player,
          second.action,
          secondSilence
        );
    }


''' + marker

          if marker not in text:
              raise SystemExit("Execucao normal do segundo jogador nao encontrada")
          text = text.replace(marker, addition, 1)

          path.write_text(text, encoding="utf-8")

          # ============================================================
          # attack.js
          # ============================================================
          path = Path("src/routes/attack.js")
          text = path.read_text(encoding="utf-8")

          marker = '''    if (
              result.error ===
              "INVALID_SLOT"
            ) {'''
          marker = "\n".join(line[10:] if line.startswith("          ") else line for line in marker.splitlines())

          addition = r'''    if (
      result.error ===
      "SILENCED_SKILL"
    ) {
      return new Response(
        `@${user}, você está Silenciado por ${result.source || "Silêncio"}. ` +
        `Enquanto durar, use Soco, uma habilidade Física ou !meditar.`
      );
    }


''' + marker

          if marker not in text:
              raise SystemExit("INVALID_SLOT em attack.js nao encontrado")
          text = text.replace(marker, addition, 1)

          marker = '''    if (
              execution.kind ===
              "control_blocked"
            ) {'''
          marker = "\n".join(line[10:] if line.startswith("          ") else line for line in marker.splitlines())

          addition = r'''    if (
      execution.kind ===
      "silence_blocked"
    ) {
      const source =
        execution.silence?.source
          ? ` por ${execution.silence.source}`
          : "";

      return (
        `🤐 @${execution.attacker} tentou usar ${execution.skill}, ` +
        `mas está Silenciado${source} e não conseguiu usar a habilidade por causa do Silêncio.`
      );
    }


''' + marker

          if marker not in text:
              raise SystemExit("control_blocked em attack.js nao encontrado")
          text = text.replace(marker, addition, 1)

          marker = '''    if (
              execution.kind ===
              "blindness"
            ) {'''
          marker = "\n".join(line[10:] if line.startswith("          ") else line for line in marker.splitlines())

          addition = r'''    if (
      execution.kind ===
      "silence"
    ) {
      if (!execution.hit) {
        return (
          `@${execution.attacker} usou ${execution.skill}, ` +
          `mas errou.`
        );
      }


      const defenderHpData =
        hpData.player1.user ===
        execution.defender
          ? hpData.player1
          : hpData.player2;


      const hpAfterExecution =
        Number.isFinite(
          Number(
            execution.defenderHp
          )
        )
          ? Number(
              execution.defenderHp
            )
          : defenderHpData.current;


      let text =
        `@${execution.attacker} usou ${execution.skill} ` +
        `e causou ${execution.damage} de dano em ` +
        `@${execution.defender}. ` +
        `HP: ${hpAfterExecution}/${defenderHpData.max}.`;


      if (
        execution.silenceApplied &&
        execution.silence
      ) {
        text +=
          ` 🤐 @${execution.defender} ficou Silenciado: ` +
          `apenas habilidades Físicas e Meditação ` +
          `por ${execution.silence.duration} turnos.`;
      }


      return text;
    }


''' + marker

          if marker not in text:
              raise SystemExit("blindness em attack.js nao encontrado")
          text = text.replace(marker, addition, 1)

          path.write_text(text, encoding="utf-8")

          # ============================================================
          # estado.js
          # ============================================================
          path = Path("src/routes/estado.js")
          text = path.read_text(encoding="utf-8")

          marker = '''  /*
             * ==============================
             * DANO PERIÓDICO
             * =============================='''
          marker = "\n".join(line[10:] if line.startswith("          ") else line for line in marker.splitlines())

          addition = r'''  /*
   * ==============================
   * SILÊNCIO
   * ==============================
   */
  if (
    type === "silencio" &&
    effect.effectCategory ===
      "restriction"
  ) {
    const remaining =
      Number.isFinite(
        Number(
          effect.expiresAtTurn
        )
      )
        ? Math.max(
            0,
            Number(
              effect.expiresAtTurn
            ) -
            Number(turn)
          )
        : 0;


    return (
      `🤐 ${name || "Silêncio"} — ` +
      `Silêncio: apenas Físicas/Meditação (${remaining}T)`
    );
  }


''' + marker

          if marker not in text:
              raise SystemExit("Ponto de formatacao de efeitos em estado.js nao encontrado")
          text = text.replace(marker, addition, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validar sintaxe e testes
        run: |
          node --check src/systems/silence.js
          node --check src/durable/PvpCoordinator.js
          node --check src/routes/attack.js
          node --check src/routes/estado.js
          node --check testar_silencio_pvp.mjs
          node --check testar_silencio_ordem_pvp.mjs
          node --check testar_mensagens_silencio.mjs

          node testar_silencio_pvp.mjs
          node testar_silencio_ordem_pvp.mjs
          node testar_mensagens_silencio.mjs

          node testar_cegueira_pvp.mjs
          node testar_cegueira_ordem_pvp.mjs
          node testar_veneno_pvp.mjs
          node testar_queimadura_pvp.mjs
          node testar_sangramento_pvp.mjs
          node testar_controle_pvp.mjs
          node testar_paralisia_pvp.mjs
          node testar_congelamento_pvp.mjs
          node testar_atordoamento_pvp.mjs
          node testar_regen_mentalidade_pvp.mjs

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            src/durable/PvpCoordinator.js \
            src/routes/attack.js \
            src/routes/estado.js

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao necessaria."
            exit 0
          fi

          git commit -m "Integra Silencio ao PvP"
          git push
