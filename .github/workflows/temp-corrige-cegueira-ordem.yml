name: Corrigir duracao da Cegueira

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-corrige-cegueira-ordem.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Corrigir semantica de duracao
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # skill-effects.js
          path = Path("src/systems/skill-effects.js")
          text = path.read_text(encoding="utf-8")

          text, n = re.subn(
              r'export function applyBlindnessEffect\(\n  target,\n  skill,\n  currentTurn\n\) \{',
              'export function applyBlindnessEffect(\n  target,\n  skill,\n  currentTurn,\n  {\n    targetAlreadyActed = false\n  } = {}\n) {',
              text,
              count=1
          )
          if n != 1:
              raise SystemExit("Assinatura de applyBlindnessEffect nao encontrada")

          start = text.index("export function applyBlindnessEffect(")
          end = text.index("export function applyDamageOverTimeEffect(", start)
          segment = text[start:end]

          segment, n = re.subn(
              r'\n  const effect = \{\n    type:\n      "debuff",',
              '\n  const expiryOffset =\n    targetAlreadyActed\n      ? 1\n      : 0;\n\n\n  const effect = {\n    type:\n      "debuff",',
              segment,
              count=1
          )
          if n != 1:
              raise SystemExit("Criacao do effect de Cegueira nao encontrada")

          segment, n = re.subn(
              r'expiresAtTurn:\n      Number\(currentTurn\) \+\n      duration',
              'expiresAtTurn:\n      Number(currentTurn) +\n      duration +\n      expiryOffset',
              segment,
              count=1
          )
          if n != 1:
              raise SystemExit("expiresAtTurn da Cegueira nao encontrado")

          text = text[:start] + segment + text[end:]
          path.write_text(text, encoding="utf-8")

          # PvpCoordinator.js
          path = Path("src/durable/PvpCoordinator.js")
          text = path.read_text(encoding="utf-8")

          text, n = re.subn(
              r'function executeBlindnessAction\(\n  attacker,\n  defender,\n  action,\n  currentTurn\n\) \{',
              'function executeBlindnessAction(\n  attacker,\n  defender,\n  action,\n  currentTurn,\n  defenderAlreadyActed = false\n) {',
              text,
              count=1
          )
          if n != 1:
              raise SystemExit("Assinatura de executeBlindnessAction nao encontrada")

          text, n = re.subn(
              r'  const blindness =\n    applyBlindnessEffect\(\n      defender,\n      action\.skill,\n      currentTurn\n    \);',
              '  const blindness =\n    applyBlindnessEffect(\n      defender,\n      action.skill,\n      currentTurn,\n      {\n        targetAlreadyActed:\n          defenderAlreadyActed\n      }\n    );',
              text,
              count=1
          )
          if n != 1:
              raise SystemExit("Chamada de applyBlindnessEffect nao encontrada")

          text, n = re.subn(
              r'function executeBattleAction\(\n  attacker,\n  defender,\n  action,\n  currentTurn\n\) \{',
              'function executeBattleAction(\n  attacker,\n  defender,\n  action,\n  currentTurn,\n  {\n    defenderAlreadyActed = false\n  } = {}\n) {',
              text,
              count=1
          )
          if n != 1:
              raise SystemExit("Assinatura de executeBattleAction nao encontrada")

          text, n = re.subn(
              r'    return executeBlindnessAction\(\n      attacker,\n      defender,\n      action,\n      currentTurn\n    \);',
              '    return executeBlindnessAction(\n      attacker,\n      defender,\n      action,\n      currentTurn,\n      defenderAlreadyActed\n    );',
              text,
              count=1
          )
          if n != 1:
              raise SystemExit("Chamada de executeBlindnessAction nao encontrada")

          text, n = re.subn(
              r'      secondExecution =\n        executeBattleAction\(\n          second\.player,\n          first\.player,\n          second\.action,\n          battle\.turn\n        \);',
              '      secondExecution =\n        executeBattleAction(\n          second.player,\n          first.player,\n          second.action,\n          battle.turn,\n          {\n            defenderAlreadyActed:\n              true\n          }\n        );',
              text,
              count=1
          )
          if n != 1:
              raise SystemExit("Segunda execucao de batalha nao encontrada")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validar
        run: |
          node --check src/systems/skill-effects.js
          node --check src/durable/PvpCoordinator.js
          node --check testar_cegueira_pvp.mjs
          node --check testar_cegueira_ordem_pvp.mjs

          node testar_cegueira_pvp.mjs
          node testar_cegueira_ordem_pvp.mjs
          node testar_mensagens_cegueira.mjs

          node testar_veneno_pvp.mjs
          node testar_queimadura_pvp.mjs
          node testar_sangramento_pvp.mjs
          node testar_controle_pvp.mjs
          node testar_paralisia_pvp.mjs
          node testar_congelamento_pvp.mjs
          node testar_atordoamento_pvp.mjs

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/systems/skill-effects.js src/durable/PvpCoordinator.js

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao necessaria."
            exit 0
          fi

          git commit -m "Corrige duracao da Cegueira independente da ordem"
          git push
