name: Integrar cooldown real de habilidades

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-skill-cooldown.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar patch
        run: python .github/patches/patch_skill_cooldown.py

      - name: Validar
        run: |
          node --check src/systems/cooldown.js
          node --check src/durable/PvpCoordinator.js
          node --check src/routes/attack.js
          node testar_cooldown_pvp.mjs
          node testar_counter_refletir_pvp.mjs
          node testar_sono_pvp.mjs
          node testar_integracao_sono_pvp.mjs
          node testar_confusao_pvp.mjs
          node testar_lentidao_pvp.mjs
          node testar_silencio_pvp.mjs
          node testar_cegueira_pvp.mjs
          node testar_controle_pvp.mjs
          node testar_persistencia_perfil_forte.mjs
          node testar_regen_mentalidade_pvp.mjs
          npx wrangler deploy --dry-run

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/durable/PvpCoordinator.js src/routes/attack.js
          git commit -m "Integra cooldown real de habilidades ao PvP" || exit 0
          git push
