name: Corrigir persistencia forte do perfil

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-profile-store-forte.yml"

permissions:
  contents: write

jobs:
  fix-profile-store:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar patch
        run: python .github/patches/patch_profile_store.py

      - name: Validar sintaxe e regressao
        run: |
          node --check src/core/database.js
          node --check src/core/profile.js
          node --check src/durable/PvpCoordinator.js
          node testar_persistencia_perfil_forte.mjs
          node testar_regen_mentalidade_pvp.mjs
          node testar_lentidao_pvp.mjs
          node testar_silencio_pvp.mjs
          node testar_cegueira_pvp.mjs
          node testar_sangramento_pvp.mjs
          node testar_veneno_pvp.mjs
          node testar_queimadura_pvp.mjs
          node testar_controle_pvp.mjs
          node testar_paralisia_pvp.mjs
          node testar_congelamento_pvp.mjs
          node testar_atordoamento_pvp.mjs

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/profile.js src/durable/PvpCoordinator.js
          git commit -m "Corrige persistencia forte dos perfis" || exit 0
          git push
