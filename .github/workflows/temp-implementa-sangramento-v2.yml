name: Implementar Sangramento V2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-implementa-sangramento-v2.yml"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Implementar Sangramento
        run: |
          echo '' | base64 -d > /tmp/patch_sangramento.py
          python /tmp/patch_sangramento.py

      - name: Validar sintaxe e testes
        run: |
          node --check src/systems/skill-effects.js
          node --check src/durable/PvpCoordinator.js
          node --check src/routes/attack.js
          node --check src/routes/estado.js
          node --check testar_sangramento_pvp.mjs
          node --check testar_mensagens_sangramento.mjs
          node testar_sangramento_pvp.mjs
          node testar_mensagens_sangramento.mjs
          node testar_veneno_pvp.mjs
          node testar_queimadura_pvp.mjs
          node testar_controle_pvp.mjs
          node testar_paralisia_pvp.mjs
          node testar_congelamento_pvp.mjs
          node testar_atordoamento_pvp.mjs

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/systems/skill-effects.js src/durable/PvpCoordinator.js src/routes/attack.js
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "Implementa Sangramento no PvP"
          git push
