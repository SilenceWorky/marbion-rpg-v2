name: Integrar Counter e Refletir

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-counter-refletir.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar patch
        run: python .github/patches/patch_counter_refletir.py

      - name: Validar sintaxe e regressões
        run: |
          node --check src/systems/reactions.js
          node --check src/durable/PvpCoordinator.js
          node --check src/routes/attack.js
          node testar_counter_refletir_pvp.mjs
          node testar_sono_pvp.mjs
          node testar_integracao_sono_pvp.mjs
          node testar_confusao_pvp.mjs
          node testar_integracao_confusao_pvp.mjs
          node testar_lentidao_pvp.mjs
          node testar_silencio_pvp.mjs
          node testar_cegueira_pvp.mjs
          node testar_controle_pvp.mjs
          node testar_paralisia_pvp.mjs
          node testar_congelamento_pvp.mjs
          node testar_atordoamento_pvp.mjs
          node testar_veneno_pvp.mjs
          node testar_queimadura_pvp.mjs
          node testar_sangramento_pvp.mjs
          node testar_persistencia_perfil_forte.mjs
          node testar_regen_mentalidade_pvp.mjs

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/durable/PvpCoordinator.js src/routes/attack.js
          git commit -m "Integra Counter fisico e Refletir elemental ao PvP" || exit 0
          git push
