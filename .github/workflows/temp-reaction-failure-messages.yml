name: Corrigir mensagens de falha de Counter e Refletir

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-reaction-failure-messages.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar patch
        run: python .github/patches/patch_reaction_failure_messages.py

      - name: Validar
        run: |
          node --check src/durable/PvpCoordinator.js
          node --check src/routes/attack.js
          node testar_counter_refletir_pvp.mjs
          node testar_sono_pvp.mjs
          node testar_confusao_pvp.mjs
          node testar_lentidao_pvp.mjs
          node testar_silencio_pvp.mjs
          node testar_cegueira_pvp.mjs
          node testar_persistencia_perfil_forte.mjs
          npx wrangler deploy --dry-run

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/durable/PvpCoordinator.js src/routes/attack.js testar_counter_refletir_pvp.mjs
          git commit -m "Explica falhas de Counter e Refletir no chat" || exit 0
          git push
