name: Implementar Cegueira

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-implementa-cegueira.yml"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Implementar Cegueira
        run: |
          python - <<'PY'
          from pathlib import Path

          # ==========================================
          # skill-effects.js
          # ==========================================
          path = Path("src/systems/skill-effects.js")
          text = path.read_text(encoding="utf-8")

          if "export function applyBlindnessEffect(" not in text:
              marker = "/*\n * ==============================\n * DANO PERIÓDICO GENÉRICO"
              if marker not in text:
                  raise SystemExit("Marker de DoT genérico não encontrado em skill-effects.js")

              block = '''/*
           * ==============================
           * CEGUEIRA
           * ==============================
           *
           * Debuff especial de Precisão.
           *
           * Regras padrão:
           * - reduz 20 de Precisão;
           * - dura 2 turnos;
           * - não acumula consigo mesma;
           * - reaplicação renova a duração.
           */
          export const BLINDNESS_DEFAULT_AMOUNT =
            20;

          export const BLINDNESS_DEFAULT_DURATION =
            2;


          export function applyBlindnessEffect(
            target,
            skill,
            currentTurn
          ) {
            if (
              !Array.isArray(
                target.effects
              )
            ) {
              target.effects = [];
            }


            const requestedAmount =
              Math.max(
                1,
                Math.round(
                  getNumber(
                    skill?.debuffAmount,
                    BLINDNESS_DEFAULT_AMOUNT
                  )
                )
              );


            const duration =
              Math.max(
                1,
                Math.floor(
                  getNumber(
                    skill?.debuffDuration,
                    BLINDNESS_DEFAULT_DURATION
                  )
                )
              );


            const existingIndex =
              target.effects.findIndex(
                effect =>
                  effect?.type ===
                    "debuff" &&
                  String(
                    effect?.subtype ?? ""
                  )
                    .trim()
                    .toLowerCase() ===
                    "cegueira" &&
                  effect?.stat ===
                    "accuracy"
              );


            let refreshed =
              false;


            if (
              existingIndex >= 0
            ) {
              const existing =
                target.effects[
                  existingIndex
                ];


              target.accuracy =
                Math.max(
                  0,
                  getNumber(
                    target.accuracy
                  ) +
                  Math.max(
                    0,
                    getNumber(
                      existing.amount
                    )
                  )
                );


              target.effects.splice(
                existingIndex,
                1
              );


              refreshed =
                true;
            }


            const before =
              Math.max(
                0,
                getNumber(
                  target.accuracy
                )
              );


            const after =
              Math.max(
                0,
                before -
                requestedAmount
              );


            const appliedAmount =
              before -
              after;


            if (
              appliedAmount <= 0
            ) {
              return {
                kind:
                  "blindness",

                ok: false,

                error:
                  "BLINDNESS_NO_EFFECT",

                type:
                  "cegueira",

                subtype:
                  "cegueira",

                user:
                  target.user,

                skill:
                  skill?.nome,

                stat:
                  "accuracy",

                amount: 0,

                requestedAmount,

                before,
                after,
                duration,
                refreshed
              };
            }


            target.accuracy =
              after;


            const effect = {
              type:
                "debuff",

              subtype:
                "cegueira",

              effectCategory:
                "debuff",

              source:
                skill.nome,

              stat:
                "accuracy",

              amount:
                appliedAmount,

              requestedAmount,

              appliedAtTurn:
                Number(currentTurn),

              expiresAtTurn:
                Number(currentTurn) +
                duration
            };


            target.effects.push(
              effect
            );


            return {
              kind:
                "blindness",

              ok: true,

              type:
                "cegueira",

              subtype:
                "cegueira",

              user:
                target.user,

              skill:
                skill.nome,

              stat:
                "accuracy",

              amount:
                appliedAmount,

              requestedAmount,

              before,
              after,
              duration,
              refreshed,

              expiresAtTurn:
                effect.expiresAtTurn
            };
          }


          '''
              block = "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in block.splitlines()
              ) + "\n"
              text = text.replace(marker, block + marker, 1)

          path.write_text(text, encoding="utf-8")

          # ==========================================
          # PvpCoordinator.js
          # ==========================================
          path = Path("src/durable/PvpCoordinator.js")
          text = path.read_text(encoding="utf-8")

          if "  applyBlindnessEffect," not in text:
              marker = "  applyDebuffSkill,\n  applyPoisonEffect,"
              if marker not in text:
                  raise SystemExit("Import de applyDebuffSkill não encontrado")
              text = text.replace(
                  marker,
                  "  applyDebuffSkill,\n  applyBlindnessEffect,\n  applyPoisonEffect,",
                  1
              )

          if "function executeBlindnessAction(" not in text:
              marker = "function executePoisonAction("
              if marker not in text:
                  raise SystemExit("executePoisonAction não encontrado")

              block = '''function executeBlindnessAction(
            attacker,
            defender,
            action,
            currentTurn
          ) {
            const base =
              executeOffensiveAction(
                attacker,
                defender,
                action
              );


            if (!base.hit) {
              return {
                ...base,

                kind:
                  "blindness",

                blindnessApplied:
                  false,

                blindness:
                  null
              };
            }


            if (
              Number(
                defender.hp
              ) <= 0
            ) {
              return {
                ...base,

                kind:
                  "blindness",

                blindnessApplied:
                  false,

                blindness:
                  null
              };
            }


            const blindness =
              applyBlindnessEffect(
                defender,
                action.skill,
                currentTurn
              );


            return {
              ...base,

              kind:
                "blindness",

              blindnessApplied:
                blindness.ok,

              blindness
            };
          }


          '''
              block = "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in block.splitlines()
              ) + "\n"
              text = text.replace(marker, block + marker, 1)

          if "const debuffType =" not in text:
              marker = '''  const controlType =
    String(
      action?.skill?.controlType ?? ""
    )
      .trim()
      .toLowerCase();'''
              if marker not in text:
                  raise SystemExit("controlType não encontrado")

              replacement = '''  const debuffType =
    String(
      action?.skill?.debuffType ?? ""
    )
      .trim()
      .toLowerCase();

  const controlType =
    String(
      action?.skill?.controlType ?? ""
    )
      .trim()
      .toLowerCase();'''
              text = text.replace(marker, replacement, 1)

          if 'debuffType ===\n    "cegueira"' not in text:
              marker = "  /*\n  * DEBUFF / VENENO"
              if marker not in text:
                  raise SystemExit("Marker de Debuff/Veneno não encontrado")

              block = '''  /*
           * ==============================
           * CEGUEIRA
           * ==============================
           *
           * Dano direto + redução temporária
           * de Precisão.
           */
          if (
            debuffType ===
            "cegueira"
          ) {
            return executeBlindnessAction(
              attacker,
              defender,
              action,
              currentTurn
            );
          }

          '''
              block = "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in block.splitlines()
              ) + "\n"
              text = text.replace(marker, block + marker, 1)

          path.write_text(text, encoding="utf-8")

          # ==========================================
          # attack.js
          # ==========================================
          path = Path("src/routes/attack.js")
          text = path.read_text(encoding="utf-8")

          if 'execution.kind ===\n      "blindness"' not in text:
              marker = '''    if (
      execution.kind ===
      "poison"
    ) {'''
              if marker not in text:
                  raise SystemExit("Branch poison não encontrado em attack.js")

              block = '''    if (
            execution.kind ===
            "blindness"
          ) {
            if (!execution.hit) {
              return (
                `@${execution.attacker} usou ${execution.skill}, ` +
                `mas errou.`
              );
            }


            const defenderHpData =
              hpData.player1.user ===
              execution.defender
                ? hpData.player1
                : hpData.player2;


            const hpAfterExecution =
              Number.isFinite(
                Number(
                  execution.defenderHp
                )
              )
                ? Number(
                    execution.defenderHp
                  )
                : defenderHpData.current;


            let text =
              `@${execution.attacker} usou ${execution.skill} ` +
              `e causou ${execution.damage} de dano em ` +
              `@${execution.defender}. ` +
              `HP: ${hpAfterExecution}/${defenderHpData.max}.`;


            if (
              execution.blindnessApplied &&
              execution.blindness
            ) {
              text +=
                ` 🌑 @${execution.defender} ficou Cego: ` +
                `Precisão -${execution.blindness.amount} ` +
                `por ${execution.blindness.duration} turnos.`;
            }


            return text;
          }

          '''
              block = "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in block.splitlines()
              ) + "\n"
              text = text.replace(marker, block + marker, 1)

          path.write_text(text, encoding="utf-8")

          # ==========================================
          # estado.js
          # ==========================================
          path = Path("src/routes/estado.js")
          text = path.read_text(encoding="utf-8")

          if "  const subtype =" not in text:
              marker = '''  const name =
    effect.name ??'''
              if marker not in text:
                  raise SystemExit("const name não encontrado em estado.js")

              replacement = '''  const subtype =
    String(
      effect.subtype ??
      effect.debuffType ??
      ""
    ).toLowerCase();


  const name =
    effect.name ??'''
              text = text.replace(marker, replacement, 1)

          if 'subtype ===\n      "cegueira"' not in text:
              marker = '''  /*
   * Buff/debuff de atributo.
   */'''
              if marker not in text:
                  raise SystemExit("Marker de Buff/debuff não encontrado em estado.js")

              block = '''  /*
           * ==============================
           * CEGUEIRA
           * ==============================
           */
          if (
            type === "debuff" &&
            subtype ===
              "cegueira" &&
            effect.stat ===
              "accuracy" &&
            Number.isFinite(
              Number(
                effect.amount
              )
            )
          ) {
            const amount =
              Math.abs(
                Number(
                  effect.amount
                )
              );


            const remaining =
              Number.isFinite(
                Number(
                  effect.expiresAtTurn
                )
              )
                ? Math.max(
                    0,
                    Number(
                      effect.expiresAtTurn
                    ) -
                    Number(turn)
                  )
                : 0;


            return (
              `🌑 ${name || "Cegueira"} — ` +
              `Precisão -${amount} (${remaining}T)`
            );
          }

          '''
              block = "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in block.splitlines()
              ) + "\n"
              text = text.replace(marker, block + marker, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validar sintaxe e testes
        run: |
          node --check src/systems/skill-effects.js
          node --check src/durable/PvpCoordinator.js
          node --check src/routes/attack.js
          node --check src/routes/estado.js
          node --check testar_cegueira_pvp.mjs
          node --check testar_mensagens_cegueira.mjs

          node testar_cegueira_pvp.mjs
          node testar_mensagens_cegueira.mjs

          node testar_veneno_pvp.mjs
          node testar_queimadura_pvp.mjs
          node testar_sangramento_pvp.mjs
          node testar_controle_pvp.mjs
          node testar_paralisia_pvp.mjs
          node testar_congelamento_pvp.mjs
          node testar_atordoamento_pvp.mjs
          node testar_regen_mentalidade_pvp.mjs

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- src/systems/skill-effects.js src/durable/PvpCoordinator.js src/routes/attack.js src/routes/estado.js; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi

          git add src/systems/skill-effects.js src/durable/PvpCoordinator.js src/routes/attack.js src/routes/estado.js
          git commit -m "Implementa Cegueira no PvP"
          git push
