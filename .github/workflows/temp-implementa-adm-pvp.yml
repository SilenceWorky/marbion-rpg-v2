name: Implementar ADM PvP

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-implementa-adm-pvp.yml"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar implementacao
        run: python .github/scripts/temp_implementa_adm_pvp.py

      - name: Validar sintaxe e testes
        run: |
          node --check src/durable/PvpCoordinator.js
          node --check src/routes/admin.js
          node --check testar_adm_pvp.mjs
          node testar_adm_pvp.mjs

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/durable/PvpCoordinator.js src/routes/admin.js testar_adm_pvp.mjs
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "Implementa comandos ADM para encerrar PvP"
          git push
