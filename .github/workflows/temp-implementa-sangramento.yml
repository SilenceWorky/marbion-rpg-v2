name: Implementar Sangramento

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-implementa-sangramento.yml"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Implementar Sangramento e testes
        run: |
          python - <<'PY'
          from pathlib import Path

          # ==========================================
          # skill-effects.js
          # ==========================================
          effects_path = Path("src/systems/skill-effects.js")
          effects = effects_path.read_text(encoding="utf-8")

          if "export function applyBleedEffect(" not in effects:
              marker = "/*\n * ==============================\n * CONTROLE GENÉRICO"
              if marker not in effects:
                  raise SystemExit("Marker de Controle genérico não encontrado")

              bleed_block = '''/*
           * ==============================
           * SANGRAMENTO
           * ==============================
           *
           * Dano físico periódico.
           *
           * Por padrão:
           * - 3 ticks;
           * - primeiro tick no próximo turno;
           * - 30% do custo de Mentalidade por tick;
           * - mínimo de 2 de dano por tick.
           */
          export const BLEED_DURATION =
            3;


          export function calculateBleedDamage(
            skill
          ) {
            const cost =
              Math.max(
                0,
                getNumber(
                  skill?.custoMentalidade
                )
              );


            return Math.max(
              2,
              Math.round(
                cost * 0.30
              )
            );
          }


          export function applyBleedEffect(
            target,
            skill,
            currentTurn
          ) {
            return applyDamageOverTimeEffect(
              target,
              skill,
              currentTurn,
              {
                effectType:
                  "sangramento",

                resultKind:
                  "bleed",

                duration:
                  BLEED_DURATION,

                damagePerTurn:
                  calculateBleedDamage(
                    skill
                  )
              }
            );
          }


          '''
              bleed_block = "\n".join(line[10:] if line.startswith("          ") else line for line in bleed_block.splitlines()) + "\n"
              effects = effects.replace(marker, bleed_block + marker, 1)

          effects_path.write_text(effects, encoding="utf-8")

          # ==========================================
          # PvpCoordinator.js
          # ==========================================
          pvp_path = Path("src/durable/PvpCoordinator.js")
          pvp = pvp_path.read_text(encoding="utf-8")

          if "  applyBleedEffect," not in pvp:
              marker = "  applyBurnEffect,\n  processDamageOverTimeEffects,"
              if marker not in pvp:
                  raise SystemExit("Import de applyBurnEffect não encontrado")
              pvp = pvp.replace(
                  marker,
                  "  applyBurnEffect,\n  applyBleedEffect,\n  processDamageOverTimeEffects,",
                  1
              )

          if "function executeBleedAction(" not in pvp:
              marker = "function executeBattleAction("
              if marker not in pvp:
                  raise SystemExit("executeBattleAction não encontrado")

              bleed_func = '''function executeBleedAction(
            attacker,
            defender,
            action,
            currentTurn
          ) {
            const base =
              executeOffensiveAction(
                attacker,
                defender,
                action
              );


            if (!base.hit) {
              return {
                ...base,

                kind:
                  "bleed",

                bleedApplied:
                  false,

                bleed:
                  null
              };
            }


            if (
              Number(
                defender.hp
              ) <= 0
            ) {
              return {
                ...base,

                kind:
                  "bleed",

                bleedApplied:
                  false,

                bleed:
                  null
              };
            }


            const bleed =
              applyBleedEffect(
                defender,
                action.skill,
                currentTurn
              );


            return {
              ...base,

              kind:
                "bleed",

              bleedApplied:
                bleed.ok,

              bleed
            };
          }


          '''
              bleed_func = "\n".join(line[10:] if line.startswith("          ") else line for line in bleed_func.splitlines()) + "\n"
              pvp = pvp.replace(marker, bleed_func + marker, 1)

          if 'dotType ===\n    "sangramento"' not in pvp:
              marker = "  /*\n   * ==============================\n   * PARALISIA"
              if marker not in pvp:
                  raise SystemExit("Marker de Paralisia não encontrado")

              bleed_route = '''  /*
           * ==============================
           * SANGRAMENTO
           * ==============================
           *
           * Dano direto + DoT físico.
           */
          if (
            dotType ===
            "sangramento"
          ) {
            return executeBleedAction(
              attacker,
              defender,
              action,
              currentTurn
            );
          }

          '''
              bleed_route = "\n".join(line[10:] if line.startswith("          ") else line for line in bleed_route.splitlines()) + "\n"
              pvp = pvp.replace(marker, bleed_route + marker, 1)

          # O processador genérico precisa considerar Sangramento.
          old = '''            "veneno",
            "queimadura"
          ]'''
          new = '''            "veneno",
            "queimadura",
            "sangramento"
          ]'''
          count = pvp.count(old)
          if count not in (0, 2):
              raise SystemExit(f"Esperava 0 ou 2 listas de DoT; encontrei {count}")
          if count == 2:
              pvp = pvp.replace(old, new)

          pvp_path.write_text(pvp, encoding="utf-8")

          # ==========================================
          # attack.js
          # ==========================================
          attack_path = Path("src/routes/attack.js")
          attack = attack_path.read_text(encoding="utf-8")

          if 'execution.kind ===\n      "bleed"' not in attack:
              marker = '''      /*
      * ==============================
      * CONTROLE OFENSIVO
      * ==============================
      */'''
              if marker not in attack:
                  raise SystemExit("Marker de Controle ofensivo não encontrado em attack.js")

              bleed_message = '''    /*
             * ==============================
             * SANGRAMENTO
             * ==============================
             */
            if (
              execution.kind ===
              "bleed"
            ) {
              if (!execution.hit) {
                return (
                  `@${execution.attacker} usou ${execution.skill}, ` +
                  `mas errou.`
                );
              }


              const defenderHpData =
                hpData.player1.user ===
                execution.defender
                  ? hpData.player1
                  : hpData.player2;


              const hpAfterExecution =
                Number.isFinite(
                  Number(
                    execution.defenderHp
                  )
                )
                  ? Number(
                      execution.defenderHp
                    )
                  : defenderHpData.current;


              let text =
                `@${execution.attacker} usou ${execution.skill} ` +
                `e causou ${execution.damage} de dano em ` +
                `@${execution.defender}. ` +
                `HP: ${hpAfterExecution}/${defenderHpData.max}.`;


              if (
                execution.bleedApplied &&
                execution.bleed
              ) {
                text +=
                  ` 🩸 @${execution.defender} ficou Sangrando: ` +
                  `${execution.bleed.damagePerTurn} de dano por turno ` +
                  `por ${execution.bleed.duration} turnos.`;
              }


              return text;
            }

          '''
              bleed_message = "\n".join(line[10:] if line.startswith("          ") else line for line in bleed_message.splitlines()) + "\n"
              attack = attack.replace(marker, bleed_message + marker, 1)

          attack_path.write_text(attack, encoding="utf-8")

          # ==========================================
          # testar_sangramento_pvp.mjs
          # ==========================================
          test = r'''import assert from "node:assert/strict";

import {
  PvpCoordinator
} from "./src/durable/PvpCoordinator.js";

const SKILL_ID =
  "Vento:Lamina_de_Ar_Cortante";

class FakeStorage {
  constructor(data) {
    this.data = { pvp: data };
  }

  async get(key) {
    return this.data[key] ?? null;
  }

  async put(key, value) {
    this.data[key] = value;
  }
}

class FakeKV {
  constructor() {
    this.data = new Map();
  }

  async get(key) {
    return this.data.get(key) ?? null;
  }

  async put(key, value) {
    this.data.set(key, value);
  }

  async delete(key) {
    this.data.delete(key);
  }
}

function makeProfile(user, skillId = null) {
  return {
    user,
    race: "Terrariano",
    elements: ["Vento"],
    level: 1,
    xp: 0,
    hp: 500,
    maxHp: 500,
    mentalidade: 100,
    maxMentalidade: 100,
    strength: 10,
    magicStrength: 10,
    speed: user === "p1" ? 100 : 1,
    evasion: 0,
    accuracy: 100,
    defense: 10,
    skills: skillId ? [skillId] : [],
    skillMeta: skillId
      ? {
          [skillId]: {
            source: "admin",
            temporary: false
          }
        }
      : {},
    equippedSkills: [skillId, null, null, null],
    skillCooldowns: {},
    inventory: [],
    statusEffects: {}
  };
}

function makePlayer(user, skillId = null) {
  return {
    user,
    hp: 500,
    maxHp: 500,
    mentalidade: 100,
    maxMentalidade: 100,
    strength: 10,
    magicStrength: 10,
    speed: user === "p1" ? 100 : 1,
    evasion: 0,
    accuracy: 100,
    defense: 10,
    loadout: [skillId, null, null, null],
    effects: [],
    action: null
  };
}

const kv = new FakeKV();
await kv.put("p1", JSON.stringify(makeProfile("p1", SKILL_ID)));
await kv.put("p2", JSON.stringify(makeProfile("p2")));

const storage = new FakeStorage({
  challenges: [],
  battles: [
    {
      id: crypto.randomUUID(),
      status: "ACTIVE",
      state: "WAITING_ACTIONS",
      turn: 1,
      player1: makePlayer("p1", SKILL_ID),
      player2: makePlayer("p2"),
      createdAt: Date.now()
    }
  ]
});

const coordinator = new PvpCoordinator(
  { storage },
  { MARBION_USERS_V2: kv }
);

coordinator.applyRankedBattleResult = async () => ({ ok: true });

const originalRandom = Math.random;
Math.random = () => 0;

try {
  await coordinator.chooseAction("p1", 1);
  const result1 = await coordinator.chooseAction("p2", 4);
  const battle = storage.data.pvp.battles[0];

  const execution =
    result1.firstExecution?.kind === "bleed"
      ? result1.firstExecution
      : result1.secondExecution;

  assert.ok(execution, "Execução de Sangramento não encontrada.");
  assert.equal(execution.skill, "Lâmina de Ar Cortante");
  assert.equal(execution.kind, "bleed");
  assert.equal(execution.hit, true);
  assert.equal(execution.bleedApplied, true);
  assert.equal(execution.bleed.damagePerTurn, 10);
  assert.equal(execution.bleed.duration, 3);
  assert.equal(battle.player1.mentalidade, 67);

  const tick1 = result1.dotTicks.find(tick => tick.type === "sangramento");
  assert.ok(tick1, "Primeiro tick de Sangramento não encontrado.");
  assert.equal(tick1.damage, 10);
  assert.equal(tick1.remainingTicks, 2);

  const active1 = battle.player2.effects.find(effect => effect.type === "sangramento");
  assert.ok(active1, "Sangramento deveria permanecer ativo após o primeiro tick.");
  assert.equal(active1.remainingTicks, 2);

  await coordinator.chooseAction("p1", 4);
  const result2 = await coordinator.chooseAction("p2", 4);
  const tick2 = result2.dotTicks.find(tick => tick.type === "sangramento");
  assert.ok(tick2, "Segundo tick de Sangramento não encontrado.");
  assert.equal(tick2.damage, 10);
  assert.equal(tick2.remainingTicks, 1);

  await coordinator.chooseAction("p1", 4);
  const result3 = await coordinator.chooseAction("p2", 4);
  const tick3 = result3.dotTicks.find(tick => tick.type === "sangramento");
  assert.ok(tick3, "Terceiro tick de Sangramento não encontrado.");
  assert.equal(tick3.damage, 10);
  assert.equal(tick3.remainingTicks, 0);
  assert.equal(
    battle.player2.effects.some(effect => effect.type === "sangramento"),
    false
  );

  console.log("🩸 Lâmina de Ar Cortante aplicou Sangramento por 3 ticks.");
  console.log("✅ 10 de dano por tick (30% de 33 Mentalidade, arredondado).");
  console.log("✅ Primeiro tick ocorreu apenas no turno seguinte.");
  console.log("✅ Efeito desapareceu após o terceiro tick.");
  console.log("\n🩸 TODOS OS TESTES PvP DE SANGRAMENTO PASSARAM.");
}
finally {
  Math.random = originalRandom;
}
'''
          Path("testar_sangramento_pvp.mjs").write_text(test, encoding="utf-8")

          # ==========================================
          # testar_mensagens_sangramento.mjs
          # ==========================================
          messages = r'''import assert from "node:assert/strict";

import {
  attackRoute
} from "./src/routes/attack.js";

import {
  estadoRoute
} from "./src/routes/estado.js";

async function testAttackMessage() {
  const result = {
    ok: true,
    waiting: false,
    turn: 1,
    player1: { user: "p1", skill: "Lâmina de Ar Cortante" },
    player2: { user: "p2", skill: "Soco" },
    firstExecution: {
      kind: "bleed",
      attacker: "p1",
      defender: "p2",
      skill: "Lâmina de Ar Cortante",
      hit: true,
      damage: 40,
      defenderHp: 60,
      bleedApplied: true,
      bleed: {
        type: "sangramento",
        damagePerTurn: 10,
        duration: 3
      }
    },
    secondExecution: {
      kind: "damage",
      attacker: "p2",
      defender: "p1",
      skill: "Soco",
      hit: true,
      damage: 1,
      defenderHp: 99
    },
    hp: {
      player1: { user: "p1", current: 99, max: 100 },
      player2: { user: "p2", current: 50, max: 100 }
    },
    dotTicks: [
      {
        type: "sangramento",
        source: "Lâmina de Ar Cortante",
        user: "p2",
        damage: 10,
        hpAfter: 50,
        remainingTicks: 2
      }
    ],
    dotDefeats: { player1: null, player2: null },
    battleOver: false,
    draw: false,
    winner: null,
    loser: null,
    rankedResult: null,
    nextTurn: 2
  };

  const coordinator = {
    async fetch() {
      return new Response(JSON.stringify(result), {
        headers: { "content-type": "application/json" }
      });
    }
  };

  const env = {
    PVP_COORDINATOR: {
      idFromName() { return "test"; },
      get() { return coordinator; }
    }
  };

  const response = await attackRoute(
    new Request("https://marbion.test/attack?user=p2&slot=4"),
    env
  );
  const text = await response.text();

  assert.ok(text.includes("🩸 @p2 ficou Sangrando"));
  assert.ok(text.includes("10 de dano por turno"));
  assert.ok(text.includes("por 3 turnos"));
  assert.ok(text.includes("🩸 Sangramento"));

  console.log(text);
  console.log("✅ Mensagem de aplicação/tick de Sangramento correta.");
}

async function testEstadoMessage() {
  const profile = {
    race: "Terrariano",
    hp: 100,
    maxHp: 100,
    mentalidade: 100,
    maxMentalidade: 100,
    statusEffects: {}
  };

  const battleState = {
    ok: true,
    inBattle: true,
    turn: 2,
    opponent: "p1",
    hp: 50,
    maxHp: 100,
    mentalidade: 100,
    maxMentalidade: 100,
    effects: [
      {
        type: "sangramento",
        source: "Lâmina de Ar Cortante",
        damagePerTurn: 10,
        remainingTicks: 2,
        nextTickTurn: 3
      }
    ]
  };

  const env = {
    MARBION_USERS_V2: {
      async get() { return JSON.stringify(profile); }
    },
    PVP_COORDINATOR: {
      idFromName() { return "test"; },
      get() {
        return {
          async fetch() {
            return new Response(JSON.stringify(battleState), {
              headers: { "content-type": "application/json" }
            });
          }
        };
      }
    }
  };

  const response = await estadoRoute(
    new Request("https://marbion.test/estado?user=p2"),
    env
  );
  const text = await response.text();

  assert.ok(text.includes("🩸 Lâmina de Ar Cortante"));
  assert.ok(text.includes("10 dano/turno (2T)"));

  console.log(text);
  console.log("✅ Sangramento aparece corretamente no !estado.");
}

await testAttackMessage();
await testEstadoMessage();
console.log("\n🩸 TODOS OS TESTES DE MENSAGEM DE SANGRAMENTO PASSARAM.");
'''
          Path("testar_mensagens_sangramento.mjs").write_text(messages, encoding="utf-8")
          PY

      - name: Validar sintaxe e testes
        run: |
          node --check src/systems/skill-effects.js
          node --check src/durable/PvpCoordinator.js
          node --check src/routes/attack.js
          node --check src/routes/estado.js
          node --check testar_sangramento_pvp.mjs
          node --check testar_mensagens_sangramento.mjs

          node testar_sangramento_pvp.mjs
          node testar_mensagens_sangramento.mjs

          node testar_veneno_pvp.mjs
          node testar_queimadura_pvp.mjs
          node testar_controle_pvp.mjs
          node testar_paralisia_pvp.mjs
          node testar_congelamento_pvp.mjs
          node testar_atordoamento_pvp.mjs

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            src/systems/skill-effects.js \
            src/durable/PvpCoordinator.js \
            src/routes/attack.js \
            testar_sangramento_pvp.mjs \
            testar_mensagens_sangramento.mjs

          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi

          git commit -m "Implementa Sangramento no PvP"
          git push
